[project]
name = "langgraph-course"
version = "0.1.0"
description = "Lang-graph Course React Agent"
authors = [
    {name = "sugiharto",email = "sugihartobangsawan@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-tavily (>=0.2.18,<0.3.0)",
    "langgraph (>=1.2.7,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain-google-genai (>=4.2.6,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
